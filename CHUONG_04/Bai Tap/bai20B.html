<html>
<head>
    <title>Tính lương nhân viên</title>
    <meta charset=utf-8">
</head>
<body>
    <h2>Thông tin nhân viên</h2>

    Họ tên:
    <input type="text" name="HoTen">
    <br><br>

    Năm vào làm:
    <input type="text" id="NamVaoLam"
       onkeyup="TinhLuong();">
    <br><br>

    Hệ số:
    <input type="text" id="HeSo"
       onkeyup="TinhLuong();">
    <br><br>

    Lương cơ sở:
    <input type="text" id="LuongCoSo"
       onkeyup="TinhLuong();">
    <br><br>

    Lương cơ bản:
    <input type="text" id="LuongCoBan">
    <br><br>

    Phụ cấp:
    <input type="text" id="PhuCap">
    <br><br>

    Thâm niên:
    <input type="text" id="ThamNien">
    <br><br>

    Thành tiền:
    <input type="text" id="ThanhTien">

    <script language="javascript">
        function TinhLuong()
        {
            var namHienTai = new Date().getFullYear();
            var luongCoBan =parseFloat(HeSo.value) * parseFloat(LuongCoSo.value);
            var phuCap = luongCoBan * 0.25;
            var thamNien =namHienTai - parseInt(NamVaoLam.value);
            var thanhTien = luongCoBan + phuCap;

            LuongCoBan.value = luongCoBan;
            PhuCap.value = phuCap;
            ThamNien.value = thamNien;
            ThanhTien.value = thanhTien;
        }
    </script>

</body>
</html>
