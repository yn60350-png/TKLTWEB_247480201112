<html>
<head>
    <title>Thay đổi màu nền</title>
</head>
<body>

    <h2>Thay đổi màu nền</h2>

    <input type="button"
    name="MauXanhDuong"
    value="Màu xanh dương"
    onclick="document.bgColor='blue'">

    <input type="button"
    name="MauXanhLa"
    value="Màu xanh lá"
    onclick="document.bgColor='green'">

    <input type="button"
    name="MauVang"
    value="Màu vàng"
    onclick="document.bgColor='yellow'">
</body>
</html>
